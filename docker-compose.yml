services:
  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    container_name: codecrush-backend
    ports:
      - '4000:4000'
    env_file:
      - ./backEnd/.env

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:4000/api/v1
    container_name: codecrush-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend